<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Eclair</title>
  <desc>A golden choux pastry filled with vanilla cream and topped with glossy dark chocolate.</desc>
  <defs>
    <linearGradient id="pastry" x1="0" y1="0" x2="0.12" y2="1">
      <stop stop-color="#ffdc8c"/>
      <stop offset=".38" stop-color="#efad50"/>
      <stop offset=".72" stop-color="#cf7b2e"/>
      <stop offset="1" stop-color="#985027"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffe5a7"/>
      <stop offset=".52" stop-color="#f5bf69"/>
      <stop offset="1" stop-color="#dc8a38"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffbed"/>
      <stop offset=".55" stop-color="#fff0c9"/>
      <stop offset="1" stop-color="#dab17b"/>
    </linearGradient>
    <linearGradient id="chocolate" x1="0" y1="0" x2=".18" y2="1">
      <stop stop-color="#8d503d"/>
      <stop offset=".28" stop-color="#693729"/>
      <stop offset=".6" stop-color="#42231e"/>
      <stop offset="1" stop-color="#281817"/>
    </linearGradient>
    <linearGradient id="glaze" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#edb394" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c18368" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4c18b"/>
      <stop offset="1" stop-color="#ba713a"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-32 256 256)" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="257" cy="324" rx="199" ry="25" fill="#241313" opacity=".08"/>
    <ellipse cx="257" cy="321" rx="186" ry="18" fill="#241313" opacity=".09"/>
    <!-- The lower shell has an irregular baked edge rather than a perfect pill. -->
    <path d="M51 248C49 218 74 197 115 193L386 193C430 195 461 215 463 248L459 275C457 301 438 322 403 325L112 325C77 324 53 307 51 281Z" fill="#6e3c28"/>
    <path d="M55 250C55 225 79 208 116 205L386 204C428 205 455 222 458 248L454 277C452 301 433 317 402 320L113 320C81 319 59 305 56 280Z" fill="url(#pastry)"/>
    <path d="M70 282C85 302 103 305 128 305L391 305C419 305 437 296 447 278" fill="none" stroke="#f8c575" stroke-width="6" opacity=".55"/>
    <!-- Small folds in the choux crust. -->
    <g fill="none" stroke="#a65d2a" stroke-width="4" opacity=".55">
      <path d="M92 289l11 12m31-16 7 19m36-16 4 20m39-20-2 20m42-20-3 20m43-21-5 19m43-21-4 18m37-23-8 19m37-26-10 15"/>
    </g>
    <!-- A bright scalloped seam makes the filling legible at small sizes. -->
    <path d="M58 249C66 239 77 236 89 240C102 229 116 233 125 238C138 229 153 232 165 237C178 230 193 232 205 237C219 231 233 232 245 237C260 229 276 232 287 237C300 230 315 231 327 236C342 228 357 231 368 236C384 226 402 229 415 236C428 231 444 236 455 247L453 268C443 278 430 280 418 273C405 284 389 281 378 276C364 285 348 283 336 277C322 287 307 283 295 278C281 285 266 284 254 278C239 286 225 283 213 278C199 286 185 282 173 277C158 284 145 280 132 275C117 282 102 278 92 272C78 276 66 269 58 262Z" fill="url(#cream)"/>
    <path d="M79 253C119 246 141 251 169 250L366 248C398 245 421 249 438 254" fill="none" stroke="#fffdf5" stroke-width="7" opacity=".9"/>
    <!-- Upper shell and a narrow, warm crust beneath the chocolate. -->
    <path d="M50 233C49 196 80 170 122 167L383 167C428 169 461 195 463 231C458 248 445 257 422 257C402 258 384 252 369 254L139 258C121 257 105 263 86 256C66 252 54 245 50 233Z" fill="url(#crust)" stroke="#b96e32" stroke-width="3"/>
    <path d="M63 230C74 243 92 246 111 245L397 243C418 244 437 239 449 229" fill="none" stroke="url(#rim)" stroke-width="7"/>
    <!-- Hand-dipped ganache, with a few rounded drips along its front edge. -->
    <path d="M59 221C59 193 87 174 124 173L380 173C419 174 449 196 453 222C454 235 446 241 435 241L414 239C407 239 410 251 400 251C390 252 391 240 381 240L329 242C322 242 325 258 314 258C303 258 307 242 297 243L212 245C203 245 207 255 198 255C189 255 192 245 182 245L129 246C119 246 122 256 112 255C103 255 106 244 95 243C74 243 59 236 59 221Z" fill="url(#chocolate)" stroke="#43251f" stroke-width="3"/>
    <path d="M76 207C87 189 105 183 133 182L372 182C400 182 423 193 435 209C406 200 383 201 358 202L133 204C109 204 91 206 76 213Z" fill="url(#glaze)"/>
    <path d="M96 191C107 187 120 186 139 186L321 186" fill="none" stroke="#f5c2a4" stroke-width="4" opacity=".65"/>
    <path d="M336 186h17" fill="none" stroke="#f5c2a4" stroke-width="4" opacity=".45"/>
    <path d="M82 220C109 229 134 228 160 227" fill="none" stroke="#b37a5e" stroke-width="3" opacity=".38"/>
    <!-- Three fine ribbons of milk chocolate. -->
    <g fill="none" stroke="#d69b72" stroke-width="5" opacity=".95">
      <path d="M197 181c-8 13-9 24-2 39 3 6 6 12 6 18"/>
      <path d="M230 179c-8 14-9 25-2 40 3 7 6 13 6 20"/>
      <path d="M263 179c-8 14-9 25-2 40 3 7 6 13 6 20"/>
    </g>
    <g fill="none" stroke="#f0c49a" stroke-width="1.7" opacity=".65">
      <path d="M196 184c-6 12-6 22 0 34"/>
      <path d="M229 182c-6 12-6 23 0 35"/>
      <path d="M262 182c-6 12-6 23 0 35"/>
    </g>
  </g>
</svg>
